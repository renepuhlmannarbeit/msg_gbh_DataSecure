name: Manual platform and release evidence

# This workflow is deliberately never automatic. Start only the evidence needed
# for a release candidate; choosing "all" is the most expensive option.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Evidence to produce
        required: true
        default: platform
        type: choice
        options:
          - platform
          - release
          - all
          - standalone_windows
      confirm_runner_minutes:
        description: Confirm Windows runner minutes for the Standalone prerelease build.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    if: ${{ inputs.scope == 'platform' || inputs.scope == 'all' }}
    name: Full suite (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - if: ${{ runner.os == 'Windows' }}
        run: npm run test:windows-visual

  release:
    if: ${{ inputs.scope == 'release' || inputs.scope == 'all' }}
    name: Build release artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real Windows process birth lookup before product tests
        run: node tests/test-process-identity.js
      - run: npm run test:product:ci
      # The tracked launcher is rebuilt with the pinned MSVC 19.50.35725 on
      # the Windows release host. GitHub's rolling VS 2026 image no longer
      # supplies that exact compiler; verify the shipped bytes here rather
      # than silently accepting a different compiler's output.
      - name: Verify tracked native launcher integrity
        run: npm run native:verify
      - name: Fetch and attest pinned official Windows product runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'node-v22.23.2-win-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/$archiveName" -OutFile $archive
          node scripts/build-runtime-target.mjs --target windows-x64 --archive $archive --output dist/windows-x64
      - run: npm run build
      - run: npm run build:debug
      - run: npm run test:debug-zip
      - name: Bind exact normal and debug ZIPs to the current UAT candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          npm run build:cowork-uat-evidence -- `
            --candidate-commit $env:GITHUB_SHA `
            --normal-zip "dist/DataSecure-Privacy-Preflight-windows-x64-v$version.zip" `
            --debug-zip "dist/DataSecure-Privacy-Preflight-windows-x64-debug-v$version.zip"
      - name: Inventory the final normal, debug and UAT artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          node scripts/generate-sbom.mjs `
            --archive "dist/DataSecure-Privacy-Preflight-windows-x64-v$version.zip" `
            --archive "dist/DataSecure-Privacy-Preflight-windows-x64-debug-v$version.zip" `
            --cowork-uat "dist/DataSecure-Cowork-UAT-Evidence-v$version.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-secure-release-${{ github.sha }}
          path: |
            dist/DataSecure-Privacy-Preflight-windows-x64-v*.zip
            dist/DataSecure-Privacy-Preflight-windows-x64-debug-v*.zip
            dist/DataSecure-Cowork-UAT-Evidence-v*.zip
            dist/*.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  standalone-windows:
    if: ${{ inputs.scope == 'standalone_windows' && inputs.confirm_runner_minutes == true }}
    name: Standalone native evidence (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Install locked build and offline conversion dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix native/ocr/pilot --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix native/pdfjs/pilot --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix native/markdown/pilot --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node native/ocr/pilot/fetch-models.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Fetch and attest the pinned official Windows runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'node-v22.23.2-win-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/$archiveName" -OutFile $archive
          node scripts/build-runtime-target.mjs --target windows-x64 --archive $archive --output dist/windows-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/prepare-standalone-runtime.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Require native, frontend, document and conversion regressions
        run: npm run test:standalone
      - name: Exercise the actual isolated converter worker
        run: npm run test:standalone:conversion
      - name: Require warning-free native Rust code
        working-directory: apps/datasecure-standalone/tauri-contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Compile the actual v2 desktop and verify its portable archive
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path apps/datasecure-standalone/tauri-contract/Cargo.toml --release --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/build-standalone-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node scripts/verify-standalone-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node tests/test-standalone-package-smoke.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Require deterministic packaging of the identical compiled desktop
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = "dist/DataSecure-Standalone-$version-windows-x64.zip"
          $before = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          node scripts/build-standalone-package.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $before) { throw 'STANDALONE_PACKAGE_NOT_DETERMINISTIC' }
      - name: Launch the exact archive with a fresh isolated profile and require v2 IPC
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/manual/standalone-native-windows-launch.ps1 `
            -Archive "dist/DataSecure-Standalone-$version-windows-x64.zip" -AssertReviewWindow -AssertWorkspace -EmitEvidence
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataSecure-Standalone-windows-x64-${{ github.sha }}
          path: |
            dist/DataSecure-Standalone-*-windows-x64.zip
            dist/DataSecure-Standalone-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
