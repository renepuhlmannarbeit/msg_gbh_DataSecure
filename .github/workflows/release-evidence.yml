name: Manual platform and release evidence

# This workflow is deliberately never automatic. Start only the evidence needed
# for a release candidate; choosing "all" is the most expensive option.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Evidence to produce
        required: true
        default: platform
        type: choice
        options:
          - platform
          - release
          - all

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    if: ${{ inputs.scope == 'platform' || inputs.scope == 'all' }}
    name: Full suite (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - if: ${{ runner.os == 'Windows' }}
        run: npm run test:windows-visual

  release:
    if: ${{ inputs.scope == 'release' || inputs.scope == 'all' }}
    name: Build release artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:product:ci
      - run: npm run native:repro
      - name: Fetch and attest pinned official Windows product runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = 'node-v22.23.2-win-x64.zip'
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/$archive" -OutFile $archive
          node scripts/build-runtime-target.mjs --target windows-x64 --archive $archive --output dist/windows-x64
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-secure-release-${{ github.sha }}
          path: |
            dist/DataSecure-Privacy-Preflight-windows-x64-v*.zip
            dist/*.spdx.json
            dist/SHA256SUMS
          retention-days: 7
