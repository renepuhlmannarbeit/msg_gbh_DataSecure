name: Manual platform and release evidence

# This workflow is deliberately never automatic. Start only the evidence needed
# for a release candidate; choosing "all" is the most expensive option.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Evidence to produce
        required: true
        default: platform
        type: choice
        options:
          - platform
          - release
          - all

permissions:
  contents: read

concurrency:
  group: release-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    if: ${{ inputs.scope == 'platform' || inputs.scope == 'all' }}
    name: Full suite (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - if: ${{ runner.os == 'Windows' }}
        run: npm run test:windows-visual

  release:
    if: ${{ inputs.scope == 'release' || inputs.scope == 'all' }}
    name: Build release artifacts
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify real Windows process birth lookup before product tests
        run: node tests/test-process-identity.js
      - run: npm run test:product:ci
      # The tracked launcher is rebuilt with the pinned MSVC 19.50.35725 on
      # the Windows release host. GitHub's rolling VS 2026 image no longer
      # supplies that exact compiler; verify the shipped bytes here rather
      # than silently accepting a different compiler's output.
      - name: Verify tracked native launcher integrity
        run: npm run native:verify
      - name: Fetch and attest pinned official Windows product runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = 'node-v22.23.2-win-x64.zip'
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.23.2/$archiveName" -OutFile $archive
          node scripts/build-runtime-target.mjs --target windows-x64 --archive $archive --output dist/windows-x64
      - run: npm run build
      - run: npm run build:debug
      - run: npm run test:debug-zip
      - name: Bind exact normal and debug ZIPs to the current UAT candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          npm run build:cowork-uat-evidence -- `
            --candidate-commit $env:GITHUB_SHA `
            --normal-zip "dist/DataSecure-Privacy-Preflight-windows-x64-v$version.zip" `
            --debug-zip "dist/DataSecure-Privacy-Preflight-windows-x64-debug-v$version.zip"
      - name: Inventory the final normal, debug and UAT artifact set
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          node scripts/generate-sbom.mjs `
            --archive "dist/DataSecure-Privacy-Preflight-windows-x64-v$version.zip" `
            --archive "dist/DataSecure-Privacy-Preflight-windows-x64-debug-v$version.zip" `
            --cowork-uat "dist/DataSecure-Cowork-UAT-Evidence-v$version.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-secure-release-${{ github.sha }}
          path: |
            dist/DataSecure-Privacy-Preflight-windows-x64-v*.zip
            dist/DataSecure-Privacy-Preflight-windows-x64-debug-v*.zip
            dist/DataSecure-Cowork-UAT-Evidence-v*.zip
            dist/*.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
