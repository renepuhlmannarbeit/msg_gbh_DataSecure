name: Self-contained MCP launcher four-target pilot

on:
  workflow_dispatch:
    inputs:
      target:
        description: Evidence target; choose all only for universal ZIP evidence.
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - windows-x64
          - macos-x64
          - macos-arm64
          - all

permissions:
  contents: read

concurrency:
  group: sea-launcher-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-target:
    name: Select requested evidence target
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            windows-x64) matrix='{"include":[{"os":"windows-latest","target":"windows-x64","launcher":"datasecure-mcp.exe","archive":"node-v22.23.2-win-x64.zip","sha256":"1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97","node":"node-v22.23.2-win-x64/node.exe"}]}' ;;
            macos-x64) matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64","launcher":"datasecure-mcp","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026","node":"node-v22.23.2-darwin-x64/bin/node"}]}' ;;
            macos-arm64) matrix='{"include":[{"os":"macos-14","target":"macos-arm64","launcher":"datasecure-mcp","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6","node":"node-v22.23.2-darwin-arm64/bin/node"}]}' ;;
            linux-x64) matrix='{"include":[{"os":"ubuntu-latest","target":"linux-x64","launcher":"datasecure-mcp","archive":"node-v22.23.2-linux-x64.tar.xz","sha256":"d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307","node":"node-v22.23.2-linux-x64/bin/node"}]}' ;;
            all) matrix='{"include":[{"os":"windows-latest","target":"windows-x64","launcher":"datasecure-mcp.exe","archive":"node-v22.23.2-win-x64.zip","sha256":"1177b4137ba5adaa56354ae40f1080c7450e8ae09cecb47da459d1c52ac99f97","node":"node-v22.23.2-win-x64/node.exe"},{"os":"macos-15-intel","target":"macos-x64","launcher":"datasecure-mcp","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026","node":"node-v22.23.2-darwin-x64/bin/node"},{"os":"macos-14","target":"macos-arm64","launcher":"datasecure-mcp","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6","node":"node-v22.23.2-darwin-arm64/bin/node"},{"os":"ubuntu-latest","target":"linux-x64","launcher":"datasecure-mcp","archive":"node-v22.23.2-linux-x64.tar.xz","sha256":"d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307","node":"node-v22.23.2-linux-x64/bin/node"}]}' ;;
            *) exit 64 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  pilot:
    name: SEA launcher (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    needs: select-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch and verify the official target Node archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output "${{ matrix.archive }}" \
            "https://nodejs.org/dist/v22.23.2/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.archive }}" | sha256sum --check --strict
          case "${{ matrix.archive }}" in
            *.zip) unzip -q "${{ matrix.archive }}" ;;
            *.tar.gz) tar -xzf "${{ matrix.archive }}" ;;
            *.tar.xz) tar -xJf "${{ matrix.archive }}" ;;
          esac
      - name: Build and execute the fixed content-free SEA probe
        run: node scripts/build-sea-launcher.mjs --target "${{ matrix.target }}" --node "${{ matrix.node }}"
      - name: Rebuild once and require byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-sea-launcher.mjs --target "${{ matrix.target }}" --node "${{ matrix.node }}" \
            --output "dist/sea-repro/${{ matrix.target }}/${{ matrix.launcher }}"
          cmp "dist/sea-launcher/${{ matrix.target }}/${{ matrix.launcher }}" \
            "dist/sea-repro/${{ matrix.target }}/${{ matrix.launcher }}"
      - name: Verify the real MCP handshake without host Node in PATH
        run: node scripts/verify-sea-launcher.mjs --target "${{ matrix.target }}" --launcher "dist/sea-launcher/${{ matrix.target }}/${{ matrix.launcher }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datasecure-sea-${{ matrix.target }}-${{ github.sha }}
          path: dist/sea-launcher/
          retention-days: 7

  assemble:
    name: Fail-closed universal engineering ZIP
    if: ${{ inputs.target == 'all' }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          pattern: datasecure-sea-*-${{ github.sha }}
          path: dist/sea-all
          merge-multiple: true
      - name: Require all four evidence-bound targets and assemble
        run: node scripts/build-sea-plugin.mjs --launchers dist/sea-all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: datasecure-sea-plugin-${{ github.sha }}
          path: dist/DataSecure-Privacy-Preflight-SEA-Engineering-*.zip
          retention-days: 7
