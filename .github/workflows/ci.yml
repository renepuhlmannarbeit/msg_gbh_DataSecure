name: Cost-capped CI

# Cost policy: ordinary changes start exactly one short Linux job. Native,
# three-platform, OCR, packaging and security evidence is intentionally kept in
# the manual workflows and is run only for an explicit release/acceptance need.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'benchmarks/**'
      - 'apps/datasecure-standalone/**'
      - 'docs/canonical/**'
      - 'docs/acceptance/UAT_TEST_KIT/**'
      - 'native/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'benchmarks/**'
      - 'apps/datasecure-standalone/**'
      - 'docs/canonical/**'
      - 'docs/acceptance/UAT_TEST_KIT/**'
      - 'native/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cost-capped-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Fast privacy and repository gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Repository privacy guards
        shell: bash
        run: |
          set -euo pipefail
          tracked="$(git ls-files '*.pdf' '*.doc*' '*.xls*' '*.ppt*' || true)"
          if [ -n "$tracked" ]; then
            echo "Office/PDF files must not be committed to this repository."
            exit 1
          fi
          bad="$(git grep -Il $'\r' -- '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.ps1' '*.cpp' '*.c' || true)"
          if [ -n "$bad" ]; then
            echo "Tracked source files must use LF."
            exit 1
          fi
          node -e "const p=require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length) process.exit(1)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install locked development-only test oracles
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the cost-capped product regression set
        run: npm run test:product:ci
