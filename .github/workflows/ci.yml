name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no real documents are tracked
        shell: bash
        run: |
          tracked="$(git ls-files '*.pdf' '*.docx' '*.xlsx' '*.pptx' || true)"
          test -z "$tracked" || { echo "Office/PDF files must not be committed to this public repo:"; echo "$tracked"; exit 1; }
      - run: npm test
      - run: npm run build:mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: eu-privacy-mcpb
          path: dist/*.mcpb
