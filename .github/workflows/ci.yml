name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: No real documents may be tracked
        shell: bash
        run: |
          tracked="$(git ls-files '*.pdf' '*.doc*' '*.xls*' '*.ppt*' || true)"
          if [ -n "$tracked" ]; then
            echo "Office/PDF files must not be committed to this repository:"
            echo "$tracked"
            exit 1
          fi

      - name: No CRLF in tracked sources
        shell: bash
        run: |
          bad="$(git grep -Il $'\r' -- '*.js' '*.mjs' '*.json' '*.md' '*.yml' '*.ps1' '*.cpp' || true)"
          if [ -n "$bad" ]; then
            echo "These files contain CRLF; .gitattributes enforces LF:"
            echo "$bad"
            exit 1
          fi

      - name: No runtime dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ] || [ -d node_modules ]; then
            echo "The offline promise forbids installed dependencies."
            exit 1
          fi

  test:
    name: Test supported Windows runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run privacy, parser, image, MCP and plugin tests
        run: npm test
      - name: Run real Windows visual Job Object acceptance
        run: npm run test:windows-visual

  build:
    name: Build plugin and MCPB
    needs: [guard, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Build Claude plugin ZIP and standalone MCPB
        run: |
          npm run native:repro
          npm run build
      - name: Verify both packaged runtimes and parser boundary
        shell: bash
        run: |
          set -e
          mkdir -p .verify/plugin .verify/mcpb
          unzip -q -o dist/*.zip -d .verify/plugin
          unzip -q -o dist/*.mcpb -d .verify/mcpb
          for runtime in .verify/plugin/server/index.js .verify/mcpb/server/index.js; do
            reply="$(printf '%s\n%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"privacy_status","arguments":{}}}' | node "$runtime")"
            echo "$reply" | grep -q 'eu-privacy-document-gateway'
            echo "$reply" | grep -q 'windows_job_object'
            echo "$reply" | grep -q '"text_engine":"ready"'
            echo "$reply" | grep -q '"visual_boundary":"windows_job_object"'
            echo "$reply" | grep -q '"blocked_inputs":\[{"format":"PDF","reason":"PDF_COVERAGE_UNVERIFIED"}\]'
          done
          test -f .verify/plugin/bin/windows-x64/datasecure-sandbox.exe
          test -f .verify/mcpb/bin/windows-x64/datasecure-sandbox.exe
      - name: Test the packaged German skills with synthetic contracts
        run: npm run test:plugin-zip
      - name: Generate SPDX SBOM and SHA-256 checksums
        run: node scripts/generate-sbom.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-secure-build-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.mcpb
            dist/*.spdx.json
            dist/SHA256SUMS
