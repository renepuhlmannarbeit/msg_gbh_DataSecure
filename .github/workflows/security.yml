name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          upload: never
          upload-database: false
          output: codeql-results
      - name: Enforce clean CodeQL result
        run: node scripts/check-sarif.mjs codeql-results
      - name: Archive CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results
          if-no-files-found: error
          retention-days: 14

  codeql-native:
    name: CodeQL (native Windows launcher)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Initialize native CodeQL
        uses: github/codeql-action/init@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended
      - name: Build native Windows launcher
        # CodeQL compiler instrumentation intentionally changes the produced
        # bytes. CI's separate build job performs the byte-for-byte /Brepro
        # comparison for the same commit; this job compiles the same pinned
        # source/toolchain solely for native analysis.
        run: npm run native:analyze
      - name: Analyze native launcher
        uses: github/codeql-action/analyze@4c0873ef8656cb3c50b3f42fb63bc1ade0cfa827 # v4
        with:
          upload: never
          upload-database: false
          output: codeql-native-results
      - name: Enforce clean native CodeQL result
        run: node scripts/check-sarif.mjs codeql-native-results
      - name: Archive native CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-native-sarif-${{ github.sha }}
          path: codeql-native-results
          if-no-files-found: error
          retention-days: 14

  secret-history:
    name: Gitleaks (complete history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          mkdir "$install_dir"
          tar --extract --gzip --file "$archive" --directory "$install_dir" gitleaks
          "$install_dir/gitleaks" version
      - name: Scan every commit with redacted findings
        shell: bash
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git \
            --redact=100 \
            --timeout=300 \
            --log-opts="--all" \
            .
