name: Tesseract.js offline OCR three-platform pilot

on:
  workflow_dispatch:
    inputs:
      target:
        description: Evidence target; choose all only for universal runtime evidence.
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - windows-x64
          - macos-x64
          - macos-arm64
          - all

permissions:
  contents: read

concurrency:
  group: tesseractjs-ocr-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-target:
    name: Select requested evidence target
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            windows-x64) matrix='{"include":[{"os":"windows-latest","target":"windows-x64"}]}' ;;
            macos-x64) matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64"}]}' ;;
            macos-arm64) matrix='{"include":[{"os":"macos-14","target":"macos-arm64"}]}' ;;
            linux-x64) matrix='{"include":[{"os":"ubuntu-latest","target":"linux-x64"}]}' ;;
            all) matrix='{"include":[{"os":"windows-latest","target":"windows-x64"},{"os":"macos-15-intel","target":"macos-x64"},{"os":"macos-14","target":"macos-arm64"},{"os":"ubuntu-latest","target":"linux-x64"}]}' ;;
            *) exit 64 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  pilot:
    name: Offline OCR pilot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    needs: select-target
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: native/ocr/pilot/package-lock.json
      - name: Install locked pilot dependencies
        run: npm ci --prefix native/ocr/pilot --ignore-scripts
      - name: Build native POSIX resource supervisor
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror native/ocr/pilot/posix-sandbox.c -o native/ocr/pilot/datasecure-ocr-sandbox
          native/ocr/pilot/datasecure-ocr-sandbox --sandbox-contract > datasecure-posix-sandbox-contract.json
          node -e "const c=require('./datasecure-posix-sandbox-contract.json');if(c.schema!=='datasecure-posix-sandbox/v1'||c.process_group_reap!==true||c.limits.length!==7)process.exit(1)"
          echo "DATASECURE_OCR_POSIX_LAUNCHER=$GITHUB_WORKSPACE/native/ocr/pilot/datasecure-ocr-sandbox" >> "$GITHUB_ENV"
      - name: Fetch and verify official build-time language models
        run: node native/ocr/pilot/fetch-models.mjs
      - name: Generate official npm CycloneDX SBOM
        shell: bash
        run: npm sbom --prefix native/ocr/pilot --package-lock-only --sbom-format cyclonedx > tesseractjs-ocr-sbom.cdx.json
      - name: Verify dependency and model supply chain
        shell: bash
        run: node native/ocr/pilot/verify-supply-chain.mjs tesseractjs-ocr-sbom.cdx.json > tesseractjs-ocr-supply-chain.json
      - name: Run OCR with process-level network denial
        shell: bash
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/native/ocr/pilot/network-deny.cjs
        run: node native/ocr/pilot/run.mjs > tesseractjs-ocr-pilot.json
      - name: Verify normalized OCR contract and negative cases
        run: node tests/test-ocr-result-contract.mjs
      - name: Run OCR through bounded platform process
        shell: bash
        run: node native/ocr/pilot/isolated-run.mjs > tesseractjs-ocr-isolation.json
      - name: Select runtime bundle target
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then target=windows-x64
          elif [[ "$RUNNER_OS" == "Linux" ]]; then target=linux-x64
          elif [[ "$(uname -m)" == "arm64" ]]; then target=macos-arm64
          else target=macos-x64
          fi
          echo "OCR_BUNDLE_TARGET=$target" >> "$GITHUB_ENV"
      - name: Build and verify installation-free OCR runtime bundle
        shell: bash
        run: |
          node scripts/build-ocr-runtime.mjs "$OCR_BUNDLE_TARGET" > tesseractjs-ocr-bundle.json
          node tests/test-ocr-runtime-bundle.mjs "$OCR_BUNDLE_TARGET"
          node tests/test-ocr-runtime-smoke.mjs "$OCR_BUNDLE_TARGET" > tesseractjs-ocr-bundle-smoke.json
      - name: Prove pilot remains outside the released plugin
        run: node tests/test-capability-contract.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tesseractjs-ocr-pilot-${{ matrix.os }}-${{ github.sha }}
          path: |
            tesseractjs-ocr-pilot.json
            tesseractjs-ocr-isolation.json
            tesseractjs-ocr-sbom.cdx.json
            tesseractjs-ocr-supply-chain.json
            tesseractjs-ocr-bundle.json
            tesseractjs-ocr-bundle-smoke.json
            datasecure-posix-sandbox-contract.json
            dist/ocr-runtime/${{ env.OCR_BUNDLE_TARGET }}/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  universal-bundle:
    name: Assemble universal OCR runtime
    if: ${{ inputs.target == 'all' }}
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: native/ocr/pilot/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tesseractjs-ocr-pilot-*-${{ github.sha }}
          path: dist/ocr-platform-downloads
      - name: Install locked smoke-test dependency
        run: npm ci --prefix native/ocr/pilot --ignore-scripts
      - name: Assemble and verify universal installation-free runtime
        run: |
          node scripts/assemble-ocr-runtime.mjs --input dist/ocr-platform-downloads --output dist/ocr-runtime/universal > tesseractjs-ocr-universal.json
          node tests/test-ocr-universal-bundle.mjs dist/ocr-runtime/universal
          node tests/test-ocr-runtime-smoke.mjs linux-x64 dist/ocr-runtime/universal > tesseractjs-ocr-universal-smoke.json
          node scripts/build-portable-plugin.mjs --runtime dist/ocr-runtime/universal > tesseractjs-portable-plugin.json
          node scripts/verify-portable-plugin-zip.mjs
          archive="dist/DataSecure-Privacy-Preflight-Portable-Engineering-v3.2.0-rc30.zip"
          first="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          node scripts/build-portable-plugin.mjs --runtime dist/ocr-runtime/universal > tesseractjs-portable-plugin-rebuild.json
          second="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          test "$first" = "$second"
          extract="$(mktemp -d)"
          unzip -q "$archive" -d "$extract"
          test -x "$extract/server/ocr-runtime/targets/macos-x64/datasecure-ocr-sandbox"
          test -x "$extract/server/ocr-runtime/targets/macos-arm64/datasecure-ocr-sandbox"
          test -x "$extract/server/ocr-runtime/targets/linux-x64/datasecure-ocr-sandbox"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tesseractjs-ocr-universal-${{ github.sha }}
          path: |
            tesseractjs-ocr-universal.json
            tesseractjs-ocr-universal-smoke.json
            tesseractjs-portable-plugin.json
            tesseractjs-portable-plugin-rebuild.json
            dist/DataSecure-Privacy-Preflight-Portable-Engineering-v3.2.0-rc30.zip
            dist/ocr-runtime/universal/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
