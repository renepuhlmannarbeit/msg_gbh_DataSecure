name: Manual Standalone macOS sandbox evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: Start one architecture first; choose both only when both runner budgets are available.
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - macos-arm64-26
          - macos-x64
          - both
      confirm_private_runner_minutes:
        description: I understand that this private-repository run consumes included macOS minutes or billable usage.
        required: true
        default: false
        type: boolean
      upload_package:
        description: Upload the verified engineering ZIP and DMG for one day so they can be tested on a real Mac.
        required: true
        default: false
        type: boolean
      produce_static_core:
        description: Build candidate Core artifacts through the reusable producer instead of running package evidence.
        required: false
        default: false
        type: boolean
      core_candidate_run_id:
        description: Decimal run ID containing the independently reviewed final Core artifacts in this repository.
        required: false
        default: ''
        type: string
      core_candidate_source_sha:
        description: Full lowercase 40-character source commit of the final Core candidate artifacts.
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: standalone-macos-sandbox-${{ github.ref }}-${{ inputs.target }}-${{ inputs.produce_static_core }}
  cancel-in-progress: ${{ inputs.produce_static_core != true }}

jobs:
  validate-producer-target:
    name: Validate the explicitly approved Core producer target
    if: ${{ inputs.confirm_private_runner_minutes == true && inputs.produce_static_core == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - shell: bash
        env:
          CORE_PRODUCER_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$CORE_PRODUCER_TARGET" =~ ^(both|macos-arm64|macos-x64)$ ]]
  produce-static-core:
    name: Produce final sealed Core candidates for independent review
    needs: validate-producer-target
    if: ${{ inputs.confirm_private_runner_minutes == true && inputs.produce_static_core == true }}
    uses: ./.github/workflows/standalone-macos-static-core.yml
    with:
      target: ${{ inputs.target }}
      confirm_private_runner_minutes: ${{ inputs.confirm_private_runner_minutes }}
  select-target:
    name: Select explicitly approved target
    if: ${{ inputs.confirm_private_runner_minutes == true && inputs.produce_static_core != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        env:
          CORE_CANDIDATE_RUN_ID: ${{ inputs.core_candidate_run_id }}
          CORE_CANDIDATE_SOURCE_SHA: ${{ inputs.core_candidate_source_sha }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$CORE_CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CORE_CANDIDATE_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          case "$REQUESTED_TARGET" in
            macos-x64)
              matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64","rust_arch":"x86_64","sidecar":"datasecure-core-x86_64-apple-darwin","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"os":"macos-14","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            macos-arm64-26)
              matrix='{"include":[{"os":"macos-26","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            both)
              matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64","rust_arch":"x86_64","sidecar":"datasecure-core-x86_64-apple-darwin","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026"},{"os":"macos-14","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            *) exit 64 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-evidence:
    name: Standalone native evidence (${{ matrix.target }})
    needs: select-target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # Intel's complete native/ZIP/DMG gate exceeded the former 45-minute job
    # budget. Only the enclosing CI budget changes; test/IPC deadlines stay fixed.
    timeout-minutes: 75
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      DATASECURE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Install pinned build and offline-conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/ocr/pilot --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/pdfjs/pilot --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/markdown/pilot --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/graphics/pilot --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node native/ocr/pilot/fetch-models.mjs
      - name: Compile and verify the target-native POSIX supervisor
        shell: bash
        run: |
          set -euo pipefail
          destination="plugins/data-secure/server/native/${{ matrix.target }}"
          mkdir -p "$destination"
          cc -std=c11 -O2 -Wall -Wextra -Werror native/ocr/pilot/posix-sandbox.c \
            -o "$destination/datasecure-sandbox"
          chmod 700 "$destination/datasecure-sandbox"
          codesign --force --sign - "$destination/datasecure-sandbox"
          codesign --verify --strict --verbose=2 "$destination/datasecure-sandbox"
          "$destination/datasecure-sandbox" --sandbox-contract
          bash tests/test-posix-supervisor-native.sh "$destination/datasecure-sandbox"
          shasum -a 256 "$destination/datasecure-sandbox" | awk '{print $1}' \
            > "$destination/datasecure-sandbox.sha256"
          node -e "const r=require('./plugins/data-secure/server/posix-supervisor').verifyPosixSupervisor(); if(!r.available){throw new Error(r.reason)}"
      - name: Sign the target-native converter addon before inventory and bundling
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.target }}"
          arch="${arch#macos-}"
          binding="native/ocr/pilot/node_modules/@napi-rs/canvas-darwin-${arch}/skia.darwin-${arch}.node"
          test -f "$binding"
          codesign --force --sign - "$binding"
          codesign --verify --strict --verbose=2 "$binding"
      - name: Fetch and verify the pinned official Node runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output "${{ matrix.archive }}" \
            "https://nodejs.org/dist/v22.23.2/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.archive }}" | shasum -a 256 --check
          node scripts/build-runtime-target.mjs --target "${{ matrix.target }}" \
            --archive "${{ matrix.archive }}" --output "dist/${{ matrix.target }}"
      - name: Download only the exact final Core candidate from the fixed repository run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.core_candidate_run_id }}
          name: DataSecure-Mac-Core-${{ matrix.target }}-${{ inputs.core_candidate_source_sha }}
          path: ${{ runner.temp }}/datasecure-core-candidate-${{ matrix.target }}
      - name: Import four regular Core candidate files without granting artifact approval
        env:
          CORE_CANDIDATE_DIRECTORY: ${{ runner.temp }}/datasecure-core-candidate-${{ matrix.target }}
        run: >-
          node scripts/import-macos-core-candidate.mjs --target "${{ matrix.target }}"
          --input "$CORE_CANDIDATE_DIRECTORY"
      - name: Require the independently reviewed final ad-hoc sealed static Core before Prepare or Cargo
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lib/macos-core-artifact.mjs --verify "$PWD" "${{ matrix.target }}"
          core="dist/macos-static-core/${{ matrix.target }}/datasecure-core"
          # The fixed approved input must already have its FINAL seal. Never
          # re-sign it after Cargo or promote MAC-CERT-02 candidate evidence here.
          codesign --verify --strict --verbose=2 "$core"
          codesign -dv --verbose=4 "$core" 2>&1 | grep -q '^Signature=adhoc$'
          codesign -dv --verbose=4 "$core" 2>&1 | grep -q 'flags=.*runtime'
          entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-final-core-entitlements.XXXXXX")"
          codesign -d --entitlements :- "$core" > "$entitlements" 2>/dev/null
          python3 - "$entitlements" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as stream:
              assert plistlib.load(stream) == {'com.apple.security.cs.allow-jit': True}
          PY
          rm -- "$entitlements"
      - name: Project the self-contained target runtime
        run: node scripts/prepare-standalone-runtime.mjs
      - name: Run product, conversion, Rust and workflow contracts
        run: |
          set -euo pipefail
          node tests/test-import-macos-core-candidate.mjs
          node tests/test-partial-conversion.js
          node tests/test-office-diagrams.js
          node tests/test-office-occurrences.js
          node tests/test-office-image-geometry.js
          node tests/test-presentation-comments.js
          node tests/test-word-content-context.js
          node tests/test-word-context-integration.js
          node tests/test-word-parent-scope.js
          node tests/test-xlsx-content-context.js
          node tests/test-office-chart-model.js
          node tests/test-office-chartex-model.js
          node tests/test-office-math.js
          node tests/test-office-math-projection.js
          node tests/test-office-math-integration.js
          node tests/test-office-projection-countercases.js
          node tests/test-docx-table-grid.js
          node tests/test-office-table-context.js
          node tests/test-office-table-projection.js
          node tests/test-sensitive-field-coverage.js
          node tests/test-explicit-prose-field-coverage.js
          node tests/test-xlsx-table-ranges.js
          node tests/test-drawing-table-grid.js
          node tests/test-xlsx-content-projection.js
          node tests/test-xlsx-counterregressions.js
          node tests/test-cfb-protection.js
          node tests/test-pdf-native-ocr-layout.js
          node tests/test-pdf-structure-projection.mjs
          node tests/test-pdf-structure-checkpoint.mjs
          node tests/test-xlsx-content-integration.js
          node tests/test-office-context-session.js
          node tests/test-conversion-checkpoints.js
          node tests/test-uat-fixture-generation.js
          node tests/test-legacy-input-migration.js
          node tests/test-process-identity.js
          node tests/test-batch-executor-boundaries.js
          node tests/test-standalone-intake-failure.js
          node tests/test-standalone-history-read-race.js
          node tests/test-standalone-history-migration-race.js
          node tests/test-standalone-history-probe.js
          node tests/test-legacy-macos-parser-routing.js
          node tests/test-standalone-target-export-race.js
          node tests/test-standalone-target-export-snapshot.js
          node tests/lib/standalone-history-read-observer-cases.cjs
          node tests/test-result-generations.js
          node tests/test-result-companions.js
          node tests/test-confidential-workbook.js
          node tests/test-result-initial-exact-binding.js
          node tests/test-initial-output-provisioning.js
            node tests/test-mapping-diagnostics.js
            node tests/test-standalone-batch-diagnostics.js
          npm run test:standalone
          node tests/test-native-export-test-lifecycle.js
      - name: Run the real isolated converter-worker boundary
        run: npm run test:standalone:conversion
      - name: Require warning-free native Rust code
        working-directory: apps/datasecure-standalone/tauri-contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the byte-preserving intermediate app; explicit outer sealing follows
        working-directory: apps/datasecure-standalone/tauri-contract
        run: npx --no-install tauri build --bundles app --no-sign
      - name: Require unchanged pre-Cargo Core and compiled markers immediately after Tauri
        run: >-
          node scripts/lib/macos-core-artifact.mjs --app "${{ github.workspace }}" "${{ matrix.target }}"
          "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
      - name: Build the source-bound descriptor-relative relocation tool outside the app
        run: node scripts/build-standalone-macos-relocator.mjs
      - name: Prove native relocation and descriptor-bound parent replacement behavior
        run: node tests/manual/standalone-macos-relocator-native.mjs
      - name: Relocate native code into fixed Apple bundle code locations
        run: >-
          node scripts/relocate-standalone-macos-native.mjs --target "${{ matrix.target }}"
          --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
      - name: Preserve final inner Core bytes, finalize resources and seal only the outer hardened app
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          core="$bundle/Contents/MacOS/datasecure-core"
          addon_arch="${{ matrix.target }}"
          addon_arch="${addon_arch#macos-}"
          entitlements="apps/datasecure-standalone/tauri-contract/macos-core-jit.entitlements.plist"
          # Tauri --no-sign is only a copy phase. The approved Core was sealed
          # before Cargo; this step must never mutate or newly attest its bytes.
          node scripts/lib/macos-core-artifact.mjs --app "$PWD" "${{ matrix.target }}" "$bundle"
          # Preserve the hash-pinned vendor converter interpreter signature.
          # Its broader upstream entitlements are audited below, not silently
          # replaced with an untested ad-hoc library-validation policy.
          for native in "$bundle/Contents/MacOS/datasecure-conversion-node" \
            "$bundle/Contents/MacOS/datasecure-sandbox" \
            "$bundle/Contents/Frameworks/skia.darwin-${addon_arch}.node"; do
            codesign --verify --strict --verbose=2 "$native"
          done
          node scripts/finalize-standalone-macos-runtime-evidence.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          codesign --force --sign - --options runtime "$bundle"
          node scripts/lib/macos-core-artifact.mjs --app "$PWD" "${{ matrix.target }}" "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
      - name: Require the hardened static Core builtin and real ownership startup
        run: >-
          node tests/manual/standalone-macos-ownership-load.mjs
          --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          --target "${{ matrix.target }}"
      - name: Require native static Core process, worker and filesystem ownership gates
        run: >-
          node tests/test-native-macos-static-core.mjs
          --app "${{ github.workspace }}/apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          --target "${{ matrix.target }}"
      - name: Verify bundle contract, signature and native architectures
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          app="$bundle/Contents/MacOS/datasecure-standalone"
          sidecar="$bundle/Contents/MacOS/datasecure-core"
          node - "$bundle" "${{ matrix.target }}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [app, target] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(app, 'Contents/Resources/RUNTIME-EVIDENCE.json'), 'utf8'));
          const entry = manifest.target === target ? manifest.core : null;
          const bytes = fs.readFileSync(path.join(app, 'Contents/MacOS/datasecure-core'));
          if (manifest.schema !== 'datasecure-standalone-macos-runtime-evidence/2' ||
              entry?.bytes !== bytes.length || entry?.sha256 !== crypto.createHash('sha256').update(bytes).digest('hex')) {
            throw new Error('STANDALONE_MACOS_SIGNED_RUNTIME_EVIDENCE_INVALID');
          }
          NODE
          proof="$(node scripts/lib/macos-core-artifact.mjs --verify "$PWD" "${{ matrix.target }}")"
          core_sha="$(printf '%s' "$proof" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).core_sha256))')"
          artifact_sha="$(printf '%s' "$proof" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).artifact_sha256))')"
          [[ "$core_sha" =~ ^[a-f0-9]{64}$ && "$artifact_sha" =~ ^[a-f0-9]{64}$ ]]
          DATASECURE_PRODUCT_CHANNEL=standalone DATASECURE_BUNDLED_RUNTIME_REQUIRED=1 DATASECURE_NATIVE_EXPORT_CHANNEL=1 \
            DATASECURE_MACOS_STATIC_CORE_SHA256="$core_sha" DATASECURE_MACOS_STATIC_CORE_ARTIFACT_SHA256="$artifact_sha" \
            "$sidecar" - "$bundle" "${{ matrix.target }}" <<'NODE'
          const path = require('node:path');
          const [app, target] = process.argv.slice(2);
          const server = path.resolve(app, 'Contents/Resources/server');
          const info = require(path.join(server, 'runtime-info.js')).runtimeInfo();
          const proof = require(path.join(server, 'gateway/startup-guard.js')).verifyBundledRuntime();
          if (info.runtime_mode !== 'self_contained_node' || info.runtime_target !== target ||
              proof.checked !== true || proof.target !== target) {
            throw new Error('STANDALONE_MACOS_RUNNING_CORE_INTEGRITY_NOT_CHECKED');
          }
          process.stdout.write('STANDALONE_MACOS_RUNNING_CORE_INTEGRITY_CHECKED\n');
          NODE
          conversion_node="$bundle/Contents/MacOS/datasecure-conversion-node"
          supervisor="$bundle/Contents/MacOS/datasecure-sandbox"
          test -f "$bundle/Contents/Info.plist"
          test -d "$bundle/Contents/Resources/server/standalone/conversion-runtime"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = "de.msg.datasecure.standalone"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "$(node -p "require('./apps/datasecure-standalone/tauri-contract/tauri.macos.conf.json').version")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Contents/Info.plist")" = "$(node -p "require('./apps/datasecure-standalone/tauri-contract/tauri.macos.conf.json').bundle.macOS.bundleVersion")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist")" = "13.5"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSDocumentsFolderUsageDescription' "$bundle/Contents/Info.plist")" = "DataSecure speichert lokale Ergebnisse in deinem Dokumente-Ordner, wenn du keinen anderen Ergebnisordner auswählst."
          codesign --verify --deep --strict --verbose=2 "$bundle"
          codesign -dv --verbose=4 "$bundle" 2>&1 | grep -q '^Signature=adhoc$'
          # A valid signature alone does not prove that V8 can create MAP_JIT
          # pages. Verify the final signed Core and keep the UI unentitled.
          core_entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-core-entitlements.XXXXXX")"
          app_entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-app-entitlements.XXXXXX")"
          conversion_entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-conversion-entitlements.XXXXXX")"
          codesign -d --entitlements :- "$sidecar" > "$core_entitlements" 2>/dev/null
          codesign -d --entitlements :- "$app" > "$app_entitlements" 2>/dev/null || true
          codesign -d --entitlements :- "$conversion_node" > "$conversion_entitlements" 2>/dev/null
          python3 - "$core_entitlements" "$app_entitlements" "$conversion_entitlements" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as stream:
              core = plistlib.load(stream)
          assert core == {'com.apple.security.cs.allow-jit': True}, 'Core must have only allow-jit'
          try:
              with open(sys.argv[2], 'rb') as stream:
                  app = plistlib.load(stream)
          except (ValueError, plistlib.InvalidFileException):
              app = {}
          assert not app.get('com.apple.security.cs.allow-jit'), 'UI must not have JIT'
          # Existing official Node 22.23.2 development entitlements. This is
          # engineering evidence, NOT a Developer-ID/notarization release gate.
          with open(sys.argv[3], 'rb') as stream:
              converter = plistlib.load(stream)
          assert converter == {key: True for key in [
              'com.apple.security.cs.allow-jit',
              'com.apple.security.cs.allow-unsigned-executable-memory',
              'com.apple.security.cs.disable-executable-page-protection',
              'com.apple.security.cs.allow-dyld-environment-variables',
              'com.apple.security.cs.disable-library-validation',
              'com.apple.security.get-task-allow'
          ]}, 'Pinned vendor converter entitlement inventory changed'
          PY
          codesign -dv --verbose=4 "$sidecar" 2>&1 | grep -q 'flags=.*runtime'
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime'
          rm -- "$core_entitlements" "$app_entitlements" "$conversion_entitlements"
          for executable in "$app" "$sidecar" "$conversion_node" "$supervisor"; do
            test -x "$executable"
            test -z "$(find "$executable" ! -perm -005 -print -quit)"
            file "$executable"
            arches="$(lipo -archs "$executable")"
            test "$arches" = "${{ matrix.rust_arch }}"
            codesign --verify --strict --verbose=2 "$executable"
          done
          # The DMG retains bundle modes. Finder may copy into a system-owned
          # /Applications; every user must still traverse/read immutable assets.
          test -z "$(find "$bundle/Contents/Resources/server" -type d ! -perm -005 -print -quit)"
          test -z "$(find "$bundle/Contents/Resources/server" -type f ! -perm -004 -print -quit)"
          find "$bundle" -type f \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict --verbose=2 {} +
          cmp "dist/macos-static-core/${{ matrix.target }}/datasecure-core" "$sidecar"
          echo 'CUSTOM_CORE_PRE_CARGO_BYTES_PRESERVED=true'
          codesign -dv --verbose=4 "$sidecar" 2>&1 | grep -E '^(CodeDirectory|Signature=|Runtime Version=|TeamIdentifier=)' || true
          if find "$bundle" -print | grep -E '/(?:\.claude-plugin|skills|Claude|Cowork)(/|$)|/\.mcp\.json$'; then
            exit 1
          fi
      - name: Launch the packaged app through its private IPC boundary
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app" \
            --target "${{ matrix.target }}" --version "$version"
      - name: Verify regular-profile packaged startup on macOS 26
        if: ${{ matrix.os == 'macos-26' }}
        shell: bash
        run: |
          set -euo pipefail
          bash tests/manual/standalone-macos-regular-start.sh \
            --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
      - name: Build, verify and launch the deterministic distribution archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          archive="dist/DataSecure-Standalone-${version}-${{ matrix.target }}.zip"
          node scripts/build-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          cp "$archive" "${archive}.first"
          node scripts/build-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          cmp "${archive}.first" "$archive"
          rm -- "${archive}.first"
          node scripts/verify-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --archive "$archive"

          extraction="$(mktemp -d "${RUNNER_TEMP}/datasecure-macos-package.XXXXXX")"
          case "$extraction" in
            "${RUNNER_TEMP}/datasecure-macos-package."*) ;;
            *) echo "Unsafe extraction directory" >&2; exit 74 ;;
          esac
          converter_close_confirmed=false
          extraction_step_completed=false
          cleanup() {
            local exit_status="$1"
            trap - EXIT
            if [[ "$exit_status" != 0 || "$converter_close_confirmed" != true || "$extraction_step_completed" != true ]]; then
              echo "STANDALONE_MACOS_EXTRACTION_PRESERVED:$extraction" >&2
              if [[ "$exit_status" == 0 ]]; then exit_status=1; fi
              exit "$exit_status"
            fi
            if [[ ! -d "$extraction" || -L "$extraction" ]] ||
                [[ "$(dirname "$extraction")" != "$RUNNER_TEMP" ]] ||
                [[ ! "$(basename "$extraction")" =~ ^datasecure-macos-package\.[A-Za-z0-9]+$ ]] ||
                [[ "$(cd "$extraction" && pwd -P)" != "$extraction" ]]; then
              echo "STANDALONE_MACOS_EXTRACTION_TARGET_INVALID" >&2
              exit 74
            fi
            if ! rm -rf -- "$extraction"; then
              echo "STANDALONE_MACOS_EXTRACTION_CLEANUP_FAILED:$extraction" >&2
              exit 1
            fi
            exit 0
          }
          trap 'cleanup "$?"' EXIT
          ditto -x -k "$archive" "$extraction"
          packaged_app="$extraction/DataSecure-Standalone-${version}-${{ matrix.target }}/DataSecure Standalone.app"
          node scripts/lib/macos-core-artifact.mjs --app "$PWD" "${{ matrix.target }}" "$packaged_app"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"
          for executable in \
            "$packaged_app/Contents/MacOS/datasecure-standalone" \
            "$packaged_app/Contents/MacOS/datasecure-core" \
            "$packaged_app/Contents/MacOS/datasecure-conversion-node" \
            "$packaged_app/Contents/MacOS/datasecure-sandbox"; do
            test "$(lipo -archs "$executable")" = "${{ matrix.rust_arch }}"
            codesign --verify --strict --verbose=2 "$executable"
          done
          find "$packaged_app" -type f \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict --verbose=2 {} +
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$packaged_app" --target "${{ matrix.target }}" --version "$version"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$packaged_app" --target "${{ matrix.target }}" --version "$version" --launch-services
          node tests/manual/standalone-macos-packaged-conversion.mjs "$packaged_app"
          # Every successful convertBuffer above resolves only from real
          # Supervisor close. A refused/unconfirmed converter never sets this.
          converter_close_confirmed=true
          node tests/test-standalone-package-smoke.mjs "$archive"
          extraction_step_completed=true
      - name: Verify drag-to-Applications DMG contains the identical signed app
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          dmg="dist/DataSecure-Standalone-${version}-${{ matrix.target }}.dmg"
          dmg_source="$(mktemp -d "${RUNNER_TEMP}/datasecure-dmg-source.XXXXXX")"
          case "$dmg_source" in
            "${RUNNER_TEMP}/datasecure-dmg-source."*) ;;
            *) echo "Unsafe DMG source directory" >&2; exit 74 ;;
          esac
          ditto "$bundle" "$dmg_source/DataSecure Standalone.app"
          ln -s /Applications "$dmg_source/Applications"
          hdiutil create -quiet -volname "DataSecure Standalone" -srcfolder "$dmg_source" -format UDZO "$dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d "${RUNNER_TEMP}/datasecure-dmg.XXXXXX")"
          case "$mount" in
            "${RUNNER_TEMP}/datasecure-dmg."*) ;;
            *) echo "Unsafe DMG mount directory" >&2; exit 74 ;;
          esac
          mounted=false
          cleanup() {
            case "$mount" in
              "${RUNNER_TEMP}/datasecure-dmg."*)
                if [[ "$mounted" == true ]]; then hdiutil detach "$mount"; fi
                rmdir -- "$mount" ;;
              *) exit 74 ;;
            esac
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          mounted=true
          test -d "$mount/DataSecure Standalone.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = /Applications
          diff -qr "$bundle" "$mount/DataSecure Standalone.app"
          node scripts/lib/macos-core-artifact.mjs --app "$PWD" "${{ matrix.target }}" "$mount/DataSecure Standalone.app"
          codesign --verify --deep --strict --verbose=2 "$mount/DataSecure Standalone.app"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$mount/DataSecure Standalone.app" --target "${{ matrix.target }}" --version "$version"
          shasum -a 256 "$dmg" | sed "s|  .*|  $(basename "$dmg")|" > "${dmg}.sha256"
      - name: Upload the verified engineering package for one day
        if: ${{ inputs.upload_package == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataSecure-Standalone-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/DataSecure-Standalone-*-${{ matrix.target }}.zip
            dist/DataSecure-Standalone-*-${{ matrix.target }}.zip.sha256
            dist/DataSecure-Standalone-*-${{ matrix.target }}.dmg
            dist/DataSecure-Standalone-*-${{ matrix.target }}.dmg.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Write content-free evidence summary
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          app="$bundle/Contents/MacOS/datasecure-standalone"
          sidecar="$bundle/Contents/MacOS/datasecure-core"
          supervisor="$bundle/Contents/MacOS/datasecure-sandbox"
          {
            echo "### DataSecure Standalone macOS target evidence"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Target: \`${{ matrix.target }}\` on \`${{ matrix.os }}\`"
            echo "- Ad-hoc signed Tauri application bundle built and launched through the private IPC boundary."
            echo "- Tauri binary SHA-256: \`$(shasum -a 256 "$app" | awk '{print $1}')\`"
            echo "- Core runtime SHA-256: \`$(shasum -a 256 "$sidecar" | awk '{print $1}')\`"
            echo "- POSIX supervisor SHA-256: \`$(shasum -a 256 "$supervisor" | awk '{print $1}')\`"
            if [[ "${{ inputs.upload_package }}" == "true" ]]; then
              echo "- The verified engineering ZIP and DMG with SHA-256 sidecars were uploaded for one day."
            else
              echo "- No package or diagnostic artifact was uploaded."
            fi
            echo "- Human Gatekeeper, Finder picker, VoiceOver and workflow UAT remain open."
          } >> "$GITHUB_STEP_SUMMARY"
