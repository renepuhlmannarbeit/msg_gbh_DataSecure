name: Manual Standalone macOS sandbox evidence

on:
  workflow_dispatch:
    inputs:
      target:
        description: Start one architecture first; choose both only when both runner budgets are available.
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - macos-arm64-26
          - macos-x64
          - both
      confirm_private_runner_minutes:
        description: I understand that this private-repository run consumes included macOS minutes or billable usage.
        required: true
        default: false
        type: boolean
      upload_package:
        description: Upload the verified engineering ZIP and DMG for one day so they can be tested on a real Mac.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: standalone-macos-sandbox-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  select-target:
    name: Select explicitly approved target
    if: ${{ inputs.confirm_private_runner_minutes == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.target }}" in
            macos-x64)
              matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64","rust_arch":"x86_64","sidecar":"datasecure-core-x86_64-apple-darwin","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026"}]}'
              ;;
            macos-arm64)
              matrix='{"include":[{"os":"macos-14","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            macos-arm64-26)
              matrix='{"include":[{"os":"macos-26","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            both)
              matrix='{"include":[{"os":"macos-15-intel","target":"macos-x64","rust_arch":"x86_64","sidecar":"datasecure-core-x86_64-apple-darwin","archive":"node-v22.23.2-darwin-x64.tar.gz","sha256":"58e99022c2ff89395576cc7fd4d98cea24bb68081475d5f88b801ee8729fb026"},{"os":"macos-14","target":"macos-arm64","rust_arch":"arm64","sidecar":"datasecure-core-aarch64-apple-darwin","archive":"node-v22.23.2-darwin-arm64.tar.gz","sha256":"61130f394c1630d211dd50aecc4353d379480f36d3ac913cd85dbba1aed585c6"}]}'
              ;;
            *) exit 64 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native-evidence:
    name: Standalone native evidence (${{ matrix.target }})
    needs: select-target
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.5'
      DATASECURE_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Install pinned build and offline-conversion dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/ocr/pilot --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/pdfjs/pilot --ignore-scripts --no-audit --no-fund
          npm ci --prefix native/markdown/pilot --ignore-scripts --no-audit --no-fund
          node native/ocr/pilot/fetch-models.mjs
      - name: Compile and verify the target-native POSIX supervisor
        shell: bash
        run: |
          set -euo pipefail
          destination="plugins/data-secure/server/native/${{ matrix.target }}"
          mkdir -p "$destination"
          cc -std=c11 -O2 -Wall -Wextra -Werror native/ocr/pilot/posix-sandbox.c \
            -o "$destination/datasecure-sandbox"
          chmod 700 "$destination/datasecure-sandbox"
          codesign --force --sign - "$destination/datasecure-sandbox"
          codesign --verify --strict --verbose=2 "$destination/datasecure-sandbox"
          "$destination/datasecure-sandbox" --sandbox-contract
          bash tests/test-posix-supervisor-native.sh "$destination/datasecure-sandbox"
          shasum -a 256 "$destination/datasecure-sandbox" | awk '{print $1}' \
            > "$destination/datasecure-sandbox.sha256"
          node -e "const r=require('./plugins/data-secure/server/posix-supervisor').verifyPosixSupervisor(); if(!r.available){throw new Error(r.reason)}"
      - name: Sign the target-native converter addon before inventory and bundling
        shell: bash
        run: |
          set -euo pipefail
          arch="${{ matrix.target }}"
          arch="${arch#macos-}"
          binding="native/ocr/pilot/node_modules/@napi-rs/canvas-darwin-${arch}/skia.darwin-${arch}.node"
          test -f "$binding"
          codesign --force --sign - "$binding"
          codesign --verify --strict --verbose=2 "$binding"
      - name: Fetch and verify the pinned official Node runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output "${{ matrix.archive }}" \
            "https://nodejs.org/dist/v22.23.2/${{ matrix.archive }}"
          echo "${{ matrix.sha256 }}  ${{ matrix.archive }}" | shasum -a 256 --check
          node scripts/build-runtime-target.mjs --target "${{ matrix.target }}" \
            --archive "${{ matrix.archive }}" --output "dist/${{ matrix.target }}"
      - name: Project the self-contained target runtime
        run: node scripts/prepare-standalone-runtime.mjs
      - name: Run product, conversion, Rust and workflow contracts
        run: |
          node tests/test-uat-fixture-generation.js
          node tests/test-legacy-input-migration.js
          npm run test:standalone
      - name: Run the real isolated converter-worker boundary
        run: npm run test:standalone:conversion
      - name: Require warning-free native Rust code
        working-directory: apps/datasecure-standalone/tauri-contract
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build the native signed macOS application bundle
        working-directory: apps/datasecure-standalone/tauri-contract
        run: npx --no-install tauri build --bundles app
      - name: Give only the hardened Node Core its required JIT entitlement, bind bytes and re-sign the app
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          core="$bundle/Contents/MacOS/datasecure-core"
          entitlements="apps/datasecure-standalone/tauri-contract/macos-core-jit.entitlements.plist"
          # Tauri's shared macOS entitlements setting would grant JIT to the
          # UI executable as well. Re-sign only Node, before its signed-byte
          # evidence and the outer seal are generated.
          codesign --force --sign - --options runtime --entitlements "$entitlements" "$core"
          node scripts/finalize-standalone-macos-runtime-evidence.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          codesign --force --sign - --options runtime "$bundle"
          codesign --verify --deep --strict --verbose=2 "$bundle"
      - name: Verify bundle contract, signature and native architectures
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          app="$bundle/Contents/MacOS/datasecure-standalone"
          sidecar="$bundle/Contents/MacOS/datasecure-core"
          node - "$bundle" "${{ matrix.target }}" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const [app, target] = process.argv.slice(2);
          const manifest = JSON.parse(fs.readFileSync(path.join(app, 'Contents/Resources/RUNTIME-EVIDENCE.json'), 'utf8'));
          const entry = manifest.targets.find((item) => item.target === target);
          const bytes = fs.readFileSync(path.join(app, 'Contents/MacOS/datasecure-core'));
          if (manifest.schema !== 'datasecure-standalone-runtime-evidence/1' ||
              entry?.bytes !== bytes.length || entry?.sha256 !== crypto.createHash('sha256').update(bytes).digest('hex')) {
            throw new Error('STANDALONE_MACOS_SIGNED_RUNTIME_EVIDENCE_INVALID');
          }
          NODE
          DATASECURE_PRODUCT_CHANNEL=standalone DATASECURE_BUNDLED_RUNTIME_REQUIRED=1 "$sidecar" - "$bundle" "${{ matrix.target }}" <<'NODE'
          const path = require('node:path');
          const [app, target] = process.argv.slice(2);
          const server = path.resolve(app, 'Contents/Resources/server');
          const info = require(path.join(server, 'runtime-info.js')).runtimeInfo();
          const proof = require(path.join(server, 'gateway/startup-guard.js')).verifyBundledRuntime();
          if (info.runtime_mode !== 'self_contained_node' || info.runtime_target !== target ||
              proof.checked !== true || proof.target !== target) {
            throw new Error('STANDALONE_MACOS_RUNNING_CORE_INTEGRITY_NOT_CHECKED');
          }
          process.stdout.write('STANDALONE_MACOS_RUNNING_CORE_INTEGRITY_CHECKED\n');
          NODE
          conversion_node="$bundle/Contents/Resources/server/standalone/conversion-runtime/node"
          supervisor="$bundle/Contents/Resources/server/native/${{ matrix.target }}/datasecure-sandbox"
          test -f "$bundle/Contents/Info.plist"
          test -d "$bundle/Contents/Resources/server/standalone/conversion-runtime"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Contents/Info.plist")" = "de.msg.datasecure.standalone"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = "$(node -p "require('./apps/datasecure-standalone/tauri-contract/tauri.macos.conf.json').version")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Contents/Info.plist")" = "$(node -p "require('./apps/datasecure-standalone/tauri-contract/tauri.macos.conf.json').bundle.macOS.bundleVersion")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$bundle/Contents/Info.plist")" = "13.5"
          codesign --verify --deep --strict --verbose=2 "$bundle"
          codesign -dv --verbose=4 "$bundle" 2>&1 | grep -q '^Signature=adhoc$'
          # A valid signature alone does not prove that V8 can create MAP_JIT
          # pages. Verify the final signed Core and keep the UI unentitled.
          core_entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-core-entitlements.XXXXXX")"
          app_entitlements="$(mktemp "${RUNNER_TEMP}/datasecure-app-entitlements.XXXXXX")"
          codesign -d --entitlements :- "$sidecar" > "$core_entitlements" 2>/dev/null
          codesign -d --entitlements :- "$app" > "$app_entitlements" 2>/dev/null || true
          python3 - "$core_entitlements" "$app_entitlements" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], 'rb') as stream:
              core = plistlib.load(stream)
          assert core == {'com.apple.security.cs.allow-jit': True}, 'Core must have only allow-jit'
          try:
              with open(sys.argv[2], 'rb') as stream:
                  app = plistlib.load(stream)
          except (ValueError, plistlib.InvalidFileException):
              app = {}
          assert not app.get('com.apple.security.cs.allow-jit'), 'UI must not have JIT'
          PY
          codesign -dv --verbose=4 "$sidecar" 2>&1 | grep -q 'flags=.*runtime'
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'flags=.*runtime'
          rm -- "$core_entitlements" "$app_entitlements"
          for executable in "$app" "$sidecar" "$conversion_node" "$supervisor"; do
            test -x "$executable"
            test -z "$(find "$executable" ! -perm -005 -print -quit)"
            file "$executable"
            arches="$(lipo -archs "$executable")"
            test "$arches" = "${{ matrix.rust_arch }}"
            codesign --verify --strict --verbose=2 "$executable"
          done
          # The DMG retains bundle modes. Finder may copy into a system-owned
          # /Applications; every user must still traverse/read immutable assets.
          test -z "$(find "$bundle/Contents/Resources/server" -type d ! -perm -005 -print -quit)"
          test -z "$(find "$bundle/Contents/Resources/server" -type f ! -perm -004 -print -quit)"
          find "$bundle" -type f \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict --verbose=2 {} +
          if cmp -s "dist/${{ matrix.target }}/node" "$sidecar"; then
            echo 'BUNDLED_RUNTIME_BYTE_EQUAL=true'
          else
            echo 'BUNDLED_RUNTIME_BYTE_EQUAL=false'
          fi
          codesign -dv --verbose=4 "$sidecar" 2>&1 | grep -E '^(CodeDirectory|Signature=|Runtime Version=|TeamIdentifier=)' || true
          if find "$bundle" -print | grep -E '/(?:\.claude-plugin|skills|Claude|Cowork)(/|$)|/\.mcp\.json$'; then
            exit 1
          fi
      - name: Launch the packaged app through its private IPC boundary
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app" \
            --target "${{ matrix.target }}" --version "$version"
      - name: Verify regular-profile packaged startup on macOS 26
        if: ${{ matrix.os == 'macos-26' }}
        shell: bash
        run: |
          set -euo pipefail
          bash tests/manual/standalone-macos-regular-start.sh \
            --app "apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
      - name: Build, verify and launch the deterministic distribution archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          archive="dist/DataSecure-Standalone-${version}-${{ matrix.target }}.zip"
          node scripts/build-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          cp "$archive" "${archive}.first"
          node scripts/build-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --app "$bundle"
          cmp "${archive}.first" "$archive"
          rm -- "${archive}.first"
          node scripts/verify-standalone-macos-package.mjs \
            --target "${{ matrix.target }}" --archive "$archive"

          extraction="$(mktemp -d "${RUNNER_TEMP}/datasecure-macos-package.XXXXXX")"
          case "$extraction" in
            "${RUNNER_TEMP}/datasecure-macos-package."*) ;;
            *) echo "Unsafe extraction directory" >&2; exit 74 ;;
          esac
          cleanup() {
            case "$extraction" in
              "${RUNNER_TEMP}/datasecure-macos-package."*) rm -rf -- "$extraction" ;;
              *) exit 74 ;;
            esac
          }
          trap cleanup EXIT
          ditto -x -k "$archive" "$extraction"
          packaged_app="$extraction/DataSecure-Standalone-${version}-${{ matrix.target }}/DataSecure Standalone.app"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"
          for executable in \
            "$packaged_app/Contents/MacOS/datasecure-standalone" \
            "$packaged_app/Contents/MacOS/datasecure-core" \
            "$packaged_app/Contents/Resources/server/standalone/conversion-runtime/node" \
            "$packaged_app/Contents/Resources/server/native/${{ matrix.target }}/datasecure-sandbox"; do
            test "$(lipo -archs "$executable")" = "${{ matrix.rust_arch }}"
            codesign --verify --strict --verbose=2 "$executable"
          done
          find "$packaged_app" -type f \( -name '*.node' -o -name '*.dylib' \) -exec codesign --verify --strict --verbose=2 {} +
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$packaged_app" --target "${{ matrix.target }}" --version "$version"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$packaged_app" --target "${{ matrix.target }}" --version "$version" --launch-services
          node tests/manual/standalone-macos-packaged-conversion.mjs "$packaged_app"
          node tests/test-standalone-package-smoke.mjs "$archive"
      - name: Verify drag-to-Applications DMG contains the identical signed app
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          dmg="dist/DataSecure-Standalone-${version}-${{ matrix.target }}.dmg"
          dmg_source="$(mktemp -d "${RUNNER_TEMP}/datasecure-dmg-source.XXXXXX")"
          case "$dmg_source" in
            "${RUNNER_TEMP}/datasecure-dmg-source."*) ;;
            *) echo "Unsafe DMG source directory" >&2; exit 74 ;;
          esac
          ditto "$bundle" "$dmg_source/DataSecure Standalone.app"
          ln -s /Applications "$dmg_source/Applications"
          hdiutil create -quiet -volname "DataSecure Standalone" -srcfolder "$dmg_source" -format UDZO "$dmg"
          hdiutil verify "$dmg"
          mount="$(mktemp -d "${RUNNER_TEMP}/datasecure-dmg.XXXXXX")"
          case "$mount" in
            "${RUNNER_TEMP}/datasecure-dmg."*) ;;
            *) echo "Unsafe DMG mount directory" >&2; exit 74 ;;
          esac
          mounted=false
          cleanup() {
            case "$mount" in
              "${RUNNER_TEMP}/datasecure-dmg."*)
                if [[ "$mounted" == true ]]; then hdiutil detach "$mount"; fi
                rmdir -- "$mount" ;;
              *) exit 74 ;;
            esac
          }
          trap cleanup EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          mounted=true
          test -d "$mount/DataSecure Standalone.app"
          test -L "$mount/Applications"
          test "$(readlink "$mount/Applications")" = /Applications
          diff -qr "$bundle" "$mount/DataSecure Standalone.app"
          codesign --verify --deep --strict --verbose=2 "$mount/DataSecure Standalone.app"
          bash tests/manual/standalone-native-macos-launch.sh \
            --app "$mount/DataSecure Standalone.app" --target "${{ matrix.target }}" --version "$version"
          shasum -a 256 "$dmg" | sed "s|  .*|  $(basename "$dmg")|" > "${dmg}.sha256"
      - name: Upload the verified engineering package for one day
        if: ${{ inputs.upload_package == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DataSecure-Standalone-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/DataSecure-Standalone-*-${{ matrix.target }}.zip
            dist/DataSecure-Standalone-*-${{ matrix.target }}.zip.sha256
            dist/DataSecure-Standalone-*-${{ matrix.target }}.dmg
            dist/DataSecure-Standalone-*-${{ matrix.target }}.dmg.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Write content-free evidence summary
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/datasecure-standalone/tauri-contract/target/release/bundle/macos/DataSecure Standalone.app"
          app="$bundle/Contents/MacOS/datasecure-standalone"
          sidecar="$bundle/Contents/MacOS/datasecure-core"
          supervisor="$bundle/Contents/Resources/server/native/${{ matrix.target }}/datasecure-sandbox"
          {
            echo "### DataSecure Standalone macOS target evidence"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Target: \`${{ matrix.target }}\` on \`${{ matrix.os }}\`"
            echo "- Ad-hoc signed Tauri application bundle built and launched through the private IPC boundary."
            echo "- Tauri binary SHA-256: \`$(shasum -a 256 "$app" | awk '{print $1}')\`"
            echo "- Core runtime SHA-256: \`$(shasum -a 256 "$sidecar" | awk '{print $1}')\`"
            echo "- POSIX supervisor SHA-256: \`$(shasum -a 256 "$supervisor" | awk '{print $1}')\`"
            if [[ "${{ inputs.upload_package }}" == "true" ]]; then
              echo "- The verified engineering ZIP and DMG with SHA-256 sidecars were uploaded for one day."
            else
              echo "- No package or diagnostic artifact was uploaded."
            fi
            echo "- Human Gatekeeper, Finder picker, VoiceOver and workflow UAT remain open."
          } >> "$GITHUB_STEP_SUMMARY"
