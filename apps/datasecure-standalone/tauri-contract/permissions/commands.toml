[[permission]]
identifier = "allow-select-files"
description = "Öffnet die native Mehrfach-Dateiauswahl und übergibt Pfade nur an den lokalen Core."
commands.allow = ["select_files"]

[[permission]]
identifier = "allow-select-folder"
description = "Öffnet die native Ordnerauswahl und übergibt den Pfad nur an den lokalen Core."
commands.allow = ["select_folder"]

[[permission]]
identifier = "allow-cancel-admission"
description = "Verwirft eine noch nicht gestartete lokale Auswahl."
commands.allow = ["cancel_admission"]

[[permission]]
identifier = "allow-remove-admitted-source"
description = "Entfernt genau eine Datei per Position aus der noch nicht gestarteten lokalen Auswahl."
commands.allow = ["remove_admitted_source"]

[[permission]]
identifier = "allow-start-admitted-batch"
description = "Startet ausschließlich die bereits lokal geprüfte Auswahl."
commands.allow = ["start_admitted_batch"]

[[permission]]
identifier = "allow-get-public-state"
description = "Liest nur den inhaltsfreien öffentlichen Verarbeitungszustand."
commands.allow = ["get_public_state"]

[[permission]]
identifier = "allow-get-ui-context"
description = "Liest ausschließlich für die lokale Oberfläche den gewählten Quell- und Ergebnisort."
commands.allow = ["get_ui_context"]

[[permission]]
identifier = "allow-get-run-history"
description = "Zeigt höchstens 20 lokale Standalone-Läufe ohne Dokumentinhalte."
commands.allow = ["get_run_history"]

[[permission]]
identifier = "allow-get-run-failures"
description = "Liest betroffene Dateinamen und feste Fehlercodes nur lokal für den ausgewählten Standalone-Lauf."
commands.allow = ["get_run_failures"]

[[permission]]
identifier = "allow-open-review-window"
description = "Öffnet ausschließlich das lokale Standalone-Prüffenster."
commands.allow = ["open_review_window"]

[[permission]]
identifier = "allow-get-review-session"
description = "Liest nur die Kennung und Größe der aktiven lokalen Prüfsitzung."
commands.allow = ["get_review_session"]

[[permission]]
identifier = "allow-close-review-window"
description = "Schließt ausschließlich das lokale Prüffenster; eine offene Entscheidung bleibt sicher vertagt."
commands.allow = ["close_review_window"]

[[permission]]
identifier = "allow-get-review-chunk"
description = "Liest einen begrenzten Rohtextabschnitt nur im Prüffenster."
commands.allow = ["get_review_chunk"]

[[permission]]
identifier = "allow-submit-review"
description = "Sendet die vollständige lokale Entscheidung oder Vertagung an den Core."
commands.allow = ["submit_review"]

[[permission]]
identifier = "allow-continue-review-session"
description = "Setzt nur den an dieses Prüffenster gebundenen lokalen Lauf mit weiteren Fundstellen fort."
commands.allow = ["continue_review_session"]

[[permission]]
identifier = "allow-open-history-results"
description = "Öffnet ausschließlich den Ergebnisordner des lokal gebundenen Verlaufs-Eintrags."
commands.allow = ["open_history_results"]

[[permission]]
identifier = "allow-open-history-ledger"
description = "Zeigt ausschließlich die Zuordnungsdatei des lokal gebundenen Verlaufs-Eintrags."
commands.allow = ["open_history_ledger"]

[[permission]]
identifier = "allow-open-history-identity-mapping"
description = "Öffnet die vertrauliche Identitätszuordnung nur für einen lokal gebundenen Lauf."
commands.allow = ["open_history_identity_mapping"]

[[permission]]
identifier = "allow-open-identity-mappings-directory"
description = "Öffnet nur lokal den privaten Ordner dauerhaft aufbewahrter Identitätszuordnungen."
commands.allow = ["open_identity_mappings_directory"]

[[permission]]
identifier = "allow-continue-history-batch"
description = "Setzt genau den gewählten unterbrochenen Stapel nach erneuter Zustandsprüfung fort."
commands.allow = ["continue_history_batch"]

[[permission]]
identifier = "allow-ack-terminal-presented"
description = "Bestätigt inhaltsfrei, dass ein terminaler Zustand im Hauptfenster gerendert wurde."
commands.allow = ["ack_terminal_presented"]

[[permission]]
identifier = "allow-pause-batch"
description = "Speichert einen dauerhaften Pausewunsch für genau einen Standalone-Lauf."
commands.allow = ["pause_batch"]

[[permission]]
identifier = "allow-abandon-result-export"
description = "Gibt nur die automatische Fortsetzung einer unvollständigen sichtbaren Anonymisierungskopie dauerhaft auf; vorhandene Dateien bleiben unangetastet."
commands.allow = ["abandon_result_export"]

[[permission]]
identifier = "allow-skip-ocr-contact-review"
description = "Überspringt nur die gewählte OCR-Kontaktprüfung eines reinen Markdown-Laufs; Werte bleiben ungeprüft."
commands.allow = ["skip_ocr_contact_review"]

[[permission]]
identifier = "allow-continue-current-batch"
description = "Setzt den aktuell in dieser Sitzung verbundenen Lauf fort."
commands.allow = ["continue_current_batch"]

[[permission]]
identifier = "allow-configure-results"
description = "Ändert den Ergebnisordner über eine native lokale Ordnerauswahl."
commands.allow = ["configure_results"]

[[permission]]
identifier = "allow-open-current-results"
description = "Öffnet den festgelegten lokalen Ergebnisordner."
commands.allow = ["open_current_results"]

[[permission]]
identifier = "allow-open-local-ledger"
description = "Öffnet nur den lokalen Ordner der privaten Zuordnung; die Oberfläche erhält weder Pfad noch Inhalt."
commands.allow = ["open_local_ledger"]

[[permission]]
identifier = "allow-open-diagnostic-folder"
description = "Öffnet ausschließlich den festen lokalen Ordner mit inhaltsfreien Interaktionsprotokollen."
commands.allow = ["open_diagnostic_folder"]

[[permission]]
identifier = "allow-get-native-recovery-status"
description = "Liest nur die inhaltsfreie native Prozess-Abgleichphase, ohne den Core-Prozess aufzurufen."
commands.allow = ["get_native_recovery_status"]

[[permission]]
identifier = "allow-report-blocked-picker"
description = "Protokolliert nur erlaubte Picker-Aktionen und feste UI-Blockgründe ohne Dateiinhalte oder Pfade."
commands.allow = ["report_blocked_picker"]

[[permission]]
identifier = "allow-shutdown"
description = "Beendet den privaten lokalen Core-Prozess."
commands.allow = ["shutdown"]

[[permission]]
identifier = "allow-frontend-ready"
description = "Bestätigt inhaltsfrei, dass die lokale Oberfläche ihr Skript geladen hat."
commands.allow = ["frontend_ready"]
[[permission]]
identifier = "allow-open-embedded-review"
description = "Öffnet nur die laufgebundene integrierte Standalone-Prüfsitzung."
commands.allow = ["open_embedded_review"]

[[permission]]
identifier = "allow-get-document-reviews"
description = "Öffnet private nachträgliche Dokumentprüfung ausschließlich in der v2-Hauptansicht."
commands.allow = ["get_document_reviews"]

[[permission]]
identifier = "allow-close-document-reviews"
description = "Schließt die private Dokumentansicht und invalidiert ihre laufgebundene Leseberechtigung."
commands.allow = ["close_document_reviews"]

[[permission]]
identifier = "allow-get-document-review-history-summary"
description = "Liest nur Freigabe- und Exportanzahlen eines ausdrücklich ausgewählten v2-Laufs; keine Texte oder Pfade."
commands.allow = ["get_document_review_history_summary"]

[[permission]]
identifier = "allow-get-document-review-chunk"
description = "Liest nur einen revisionsgebundenen privaten Textvergleich der geöffneten Dokumentprüfung."
commands.allow = ["get_document_review_chunk"]

[[permission]]
identifier = "allow-get-document-entities"
description = "Liest ausschließlich revisionsgebundene tatsächliche Ersetzungen der geöffneten Dokumentprüfung."
commands.allow = ["get_document_entities"]

[[permission]]
identifier = "allow-decide-document-review"
description = "Speichert eine revisionsgebundene Freigabe oder zusätzliche feste Maskierung."
commands.allow = ["decide_document_review"]

[[permission]]
identifier = "allow-preview-document-export"
description = "Liest ausschließlich den servergebundenen Dateinamenplan; legt weder Auftrag noch Ergebnisdateien an."
commands.allow = ["preview_document_export"]

[[permission]]
identifier = "allow-export-approved-documents"
description = "Exportiert nur explizit ausgewählte freigegebene Dokumentrevisionen ohne private Begleitdaten."
commands.allow = ["export_approved_documents"]

[[permission]]
identifier = "allow-abandon-document-export"
description = "Unvollständigen gebundenen Exportauftrag ausdrücklich nicht weiter verfolgen; keine Dateien löschen."
commands.allow = ["abandon_document_export"]

[[permission]]
identifier = "allow-open-document-export"
description = "Open only an existing verified document export resolved privately by its run and operation identifiers."
commands.allow = ["open_document_export"]

[[permission]]
identifier = "allow-open-document-identity-overview"
description = "Open a private revision-bound identity overview for the active document review."
commands.allow = ["open_document_identity_overview"]
