[package]
name = "datasecure-standalone"
version = "3.2.0-rc161"
description = "Lokale DataSecure-Anonymisierung ohne Claude oder Cloud"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
tauri = { version = "2.11.5", features = [] }
tauri-runtime = "=2.11.3"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
