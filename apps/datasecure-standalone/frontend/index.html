<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataSecure Standalone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">GBH DataSecure</p><h1>Dateien lokal anonymisieren</h1>
      <p class="lead">Ohne Claude, Cloud oder Internet. Originaldateien bleiben unverändert.</p></header>
    <section class="card" aria-live="polite">
      <div id="status-icon" class="status-icon">✓</div>
      <div><h2 id="status-title">Bereit</h2><p id="status-text">Wähle Dateien oder einen ganzen Ordner aus.</p></div>
      <div id="summary" class="summary" hidden></div>
      <div class="actions">
        <button id="select-files" class="primary">Dateien auswählen</button>
        <button id="select-folder">Ordner auswählen</button>
        <button id="start" class="primary" hidden>Anonymisierung starten</button>
        <button id="cancel" hidden>Auswahl verwerfen</button>
        <button id="continue" class="primary" hidden>Fortsetzen</button>
        <button id="results" class="primary" hidden>Ergebnisse öffnen</button>
        <button id="ledger" hidden>Zuordnung öffnen</button>
        <button id="configure-results">Ergebnisordner ändern</button>
      </div>
    </section>
    <p class="privacy">Die Oberfläche erhält keine Dateinamen, Pfade oder Rohinhalte. Unterstützt: TXT, Markdown, CSV und DOCX.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
